[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "steelflow-ai"
version = "0.1.0"
description = "Offline synthetic decision-support digital twin for seamless OCTG manufacturing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
authors = [
  { name = "SteelFlow AI contributors" },
]
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
data = [
  "duckdb>=1.2,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "polars>=1.20,<2",
  "pyarrow>=18,<24",
]
ml = [
  "catboost>=1.2.7,<2",
  "joblib>=1.4,<2",
  "scikit-learn>=1.6,<2",
  "shap>=0.46,<1",
]
optimization = [
  "pymoo>=0.6.1,<0.7",
]
app = [
  "plotly>=5.24,<7",
  "streamlit>=1.41,<2",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
all = [
  "steelflow-ai[data,ml,optimization,app,dev]",
]

[project.scripts]
steelflow = "steelflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/steelflow"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["steelflow"]

[tool.coverage.report]
show_missing = true
skip_covered = true
