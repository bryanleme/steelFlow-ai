schema_version: "1.0"
features:
  - {feature_name: product_code, source_table: production_orders, availability_stage: PLAN, data_class: CONTEXT, recommendable: false, unit: code, description: "Synthetic product combination code."}
  - {feature_name: grade_family, source_table: production_orders, availability_stage: PLAN, data_class: CONTEXT, recommendable: false, unit: code, description: "Industrial context code only; not a normative claim."}
  - {feature_name: line_id, source_table: production_orders, availability_stage: PLAN, data_class: CONTEXT, recommendable: false, unit: code, description: "Eligible production line fixed by planning."}
  - {feature_name: shift_id, source_table: production_orders, availability_stage: PLAN, data_class: CONTEXT, recommendable: false, unit: code, description: "Scheduled shift used as context, never operator ranking."}
  - {feature_name: committed_sequence, source_table: production_orders, availability_stage: PLAN, data_class: CONTEXT, recommendable: false, unit: sequence, description: "Committed planning sequence for the line and day."}
  - {feature_name: ambient_temperature_c, source_table: production_orders, availability_stage: PLAN, data_class: CONTEXT, recommendable: false, unit: degC, description: "Synthetic ambient temperature at planned start."}
  - {feature_name: carbon_pct, source_table: billet_batches, availability_stage: PRE_PROCESS, data_class: CONTEXT, recommendable: false, unit: pct, description: "Synthetic billet carbon mass percentage."}
  - {feature_name: manganese_pct, source_table: billet_batches, availability_stage: PRE_PROCESS, data_class: CONTEXT, recommendable: false, unit: pct, description: "Synthetic billet manganese mass percentage."}
  - {feature_name: chromium_pct, source_table: billet_batches, availability_stage: PRE_PROCESS, data_class: CONTEXT, recommendable: false, unit: pct, description: "Synthetic billet chromium mass percentage."}
  - {feature_name: molybdenum_pct, source_table: billet_batches, availability_stage: PRE_PROCESS, data_class: CONTEXT, recommendable: false, unit: pct, description: "Synthetic billet molybdenum mass percentage."}
  - {feature_name: billet_diameter_mm, source_table: billet_batches, availability_stage: PRE_PROCESS, data_class: CONTEXT, recommendable: false, unit: mm, description: "Synthetic incoming billet diameter."}
  - {feature_name: billet_mass_kg, source_table: billet_batches, availability_stage: PRE_PROCESS, data_class: CONTEXT, recommendable: false, unit: kg, description: "Synthetic incoming billet mass."}
  - {feature_name: tool_wear_index, source_table: process_parameters, availability_stage: PRE_PROCESS, data_class: CONTEXT, recommendable: false, unit: ratio, description: "Simulated tool wear state at process start."}
  - {feature_name: hours_since_maintenance, source_table: process_parameters, availability_stage: PRE_PROCESS, data_class: CONTEXT, recommendable: false, unit: h, description: "Elapsed synthetic operating hours since maintenance."}
  - {feature_name: reheat_zone_1_temp_c, source_table: process_parameters, availability_stage: IN_PROCESS_REHEAT, data_class: CONTROLLABLE, recommendable: true, unit: degC, description: "Simulated reheat furnace zone one setpoint."}
  - {feature_name: reheat_zone_2_temp_c, source_table: process_parameters, availability_stage: IN_PROCESS_REHEAT, data_class: CONTROLLABLE, recommendable: true, unit: degC, description: "Simulated reheat furnace zone two setpoint."}
  - {feature_name: reheat_zone_3_temp_c, source_table: process_parameters, availability_stage: IN_PROCESS_REHEAT, data_class: CONTROLLABLE, recommendable: true, unit: degC, description: "Simulated reheat furnace zone three setpoint."}
  - {feature_name: soak_time_min, source_table: process_parameters, availability_stage: IN_PROCESS_REHEAT, data_class: CONTROLLABLE, recommendable: true, unit: min, description: "Simulated billet soaking duration."}
  - {feature_name: reheat_exit_temp_c, source_table: process_parameters, availability_stage: IN_PROCESS_REHEAT, data_class: CONTROLLABLE, recommendable: true, unit: degC, description: "Simulated furnace exit temperature."}
  - {feature_name: thermal_uniformity_index, source_table: process_parameters, availability_stage: IN_PROCESS_REHEAT, data_class: MEDIATOR, recommendable: false, unit: ratio, description: "Intermediate thermal uniformity estimate after reheating."}
  - {feature_name: roll_speed_rpm, source_table: process_parameters, availability_stage: IN_PROCESS_ROLLING, data_class: CONTROLLABLE, recommendable: true, unit: rpm, description: "Simulated rolling speed setpoint."}
  - {feature_name: roll_gap_mm, source_table: process_parameters, availability_stage: IN_PROCESS_ROLLING, data_class: CONTROLLABLE, recommendable: true, unit: mm, description: "Simulated roll gap setpoint."}
  - {feature_name: mandrel_position_mm, source_table: process_parameters, availability_stage: IN_PROCESS_ROLLING, data_class: CONTROLLABLE, recommendable: true, unit: mm, description: "Simulated plug or mandrel position."}
  - {feature_name: reduction_rate_pct, source_table: process_parameters, availability_stage: IN_PROCESS_ROLLING, data_class: CONTROLLABLE, recommendable: true, unit: pct, description: "Simulated rolling reduction rate."}
  - {feature_name: exit_speed_m_s, source_table: process_parameters, availability_stage: IN_PROCESS_ROLLING, data_class: CONTROLLABLE, recommendable: true, unit: m_s, description: "Simulated tube exit speed."}
  - {feature_name: lubrication_flow_l_min, source_table: process_parameters, availability_stage: IN_PROCESS_ROLLING, data_class: CONTROLLABLE, recommendable: true, unit: L_min, description: "Simulated lubrication flow setpoint."}
  - {feature_name: rolling_load_index, source_table: process_parameters, availability_stage: IN_PROCESS_ROLLING, data_class: MEDIATOR, recommendable: false, unit: ratio, description: "Intermediate rolling load state."}
  - {feature_name: austenitizing_temp_c, source_table: process_parameters, availability_stage: IN_PROCESS_HT, data_class: CONTROLLABLE, recommendable: true, unit: degC, description: "Simulated austenitizing temperature when applicable."}
  - {feature_name: austenitizing_time_min, source_table: process_parameters, availability_stage: IN_PROCESS_HT, data_class: CONTROLLABLE, recommendable: true, unit: min, description: "Simulated austenitizing residence time."}
  - {feature_name: quench_delay_s, source_table: process_parameters, availability_stage: IN_PROCESS_HT, data_class: CONTROLLABLE, recommendable: true, unit: s, description: "Simulated delay before quenching."}
  - {feature_name: quench_flow_l_min, source_table: process_parameters, availability_stage: IN_PROCESS_HT, data_class: CONTROLLABLE, recommendable: true, unit: L_min, description: "Simulated quench medium flow."}
  - {feature_name: quench_medium_temp_c, source_table: process_parameters, availability_stage: IN_PROCESS_HT, data_class: CONTROLLABLE, recommendable: true, unit: degC, description: "Simulated quench medium temperature."}
  - {feature_name: tempering_temp_c, source_table: process_parameters, availability_stage: IN_PROCESS_HT, data_class: CONTROLLABLE, recommendable: true, unit: degC, description: "Simulated tempering temperature."}
  - {feature_name: tempering_time_min, source_table: process_parameters, availability_stage: IN_PROCESS_HT, data_class: CONTROLLABLE, recommendable: true, unit: min, description: "Simulated tempering residence time."}
  - {feature_name: outer_diameter_deviation_mm, source_table: quality_results, availability_stage: POST_PROCESS, data_class: RESULT, recommendable: false, unit: mm, description: "Synthetic post-process dimensional result."}
  - {feature_name: wall_eccentricity_pct, source_table: quality_results, availability_stage: POST_PROCESS, data_class: RESULT, recommendable: false, unit: pct, description: "Synthetic post-process wall eccentricity."}
  - {feature_name: ovality_pct, source_table: quality_results, availability_stage: POST_PROCESS, data_class: RESULT, recommendable: false, unit: pct, description: "Synthetic post-process ovality result."}
  - {feature_name: approved_first_pass, source_table: tubes, availability_stage: POST_PROCESS, data_class: RESULT, recommendable: false, unit: boolean, description: "Synthetic first-pass approval outcome."}
  - {feature_name: good_mass_t, source_table: tubes, availability_stage: DERIVED_POST, data_class: RESULT, recommendable: false, unit: t, description: "First-pass approved mass used in TBH."}
  - {feature_name: productive_hours, source_table: tubes, availability_stage: DERIVED_POST, data_class: RESULT, recommendable: false, unit: h, description: "Synthetic productive time used in TBH."}
  - {feature_name: energy_per_good_tonne_kwh_t, source_table: energy_events, availability_stage: DERIVED_POST, data_class: RESULT, recommendable: false, unit: kWh_t, description: "Synthetic energy intensity after disposition."}
  - {feature_name: downtime_duration_min, source_table: downtime_events, availability_stage: POST_PROCESS, data_class: RESULT, recommendable: false, unit: min, description: "Observed synthetic unplanned stop duration."}
  - {feature_name: simulation_run_id, source_table: all, availability_stage: METADATA, data_class: METADATA, recommendable: false, unit: id, description: "Deterministic simulation run lineage identifier."}
